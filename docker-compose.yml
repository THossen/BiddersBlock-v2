services:
  postgres:
    image: postgres:16-alpine
    container_name: biddersblock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biddersblock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biddersblock_local}
      POSTGRES_DB: ${POSTGRES_DB:-biddersblock}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - biddersblock_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biddersblock} -d ${POSTGRES_DB:-biddersblock}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  biddersblock_postgres_data: